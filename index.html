<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terraria Craft & Combat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0c; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    #hud { position: absolute; top: 15px; left: 15px; z-index: 10; display: flex; flex-direction: column; gap: 8px; }
    .health-bar { width: 180px; height: 18px; background: #333; border: 2px solid #555; border-radius: 4px; overflow: hidden; }
    .health-fill { height: 100%; width: 100%; background: #e53935; transition: width 0.1s linear; }
    #info { font-size: 13px; background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 4px; border: 1px solid #444; }
    canvas { border: 2px solid #222; background: linear-gradient(to bottom, #101820, #080810); box-shadow: 0 10px 30px rgba(0,0,0,0.9); }
  </style>
</head>
<body>

<div id="hud">
  <div class="health-bar"><div class="health-fill" id="hp-fill"></div></div>
  <div id="info">Score: <span id="score">0</span> | Slimes Defeated: <span id="kills">0</span></div>
</div>

<canvas id="gameCanvas" width="800" height="480"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const TILE_SIZE = 32;
const COLS = 25;
const ROWS = 15;

let world = Array.from({ length: ROWS }, () => new Array(COLS).fill(0));

// Fill bottom area with stone
for (let y = 11; y < ROWS; y++) {
  for (let x = 0; x < COLS; x++) {
    world[y][x] = 1;
  }
}

let player = {
  x: 100, y: 200, w: 22, h: 44,
  vx: 0, vy: 0,
  speed: 4.5, jumpPower: -11,
  hp: 100, maxHp: 100,
  grounded: false,
  facing: 1, // 1 right, -1 left
  attacking: false, attackTimer: 0,
  invulnerable: 0
};

let enemies = [];
let score = 0;
let kills = 0;
const keys = {};

window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

canvas.addEventListener('mousedown', e => {
  if (e.button === 0 && !player.attacking) {
    player.attacking = true;
    player.attackTimer = 15; // Attack frame duration
  }
});

function spawnEnemy() {
  if (enemies.length < 5) {
    enemies.push({
      x: Math.random() > 0.5 ? 20 : 750,
      y: 200, w: 26, h: 26,
      vx: 0, vy: 0,
      hp: 30,
      color: '#4caf50',
      jumpTimer: 0
    });
  }
}

setInterval(spawnEnemy, 3000);

function checkOverlap(r1, r2) {
  return !(r1.x + r1.w <= r2.x || r1.x >= r2.x + r2.w || r1.y + r1.h <= r2.y || r1.y >= r2.y + r2.h);
}

function updatePhysics() {
  if (player.hp <= 0) return;

  // Movement
  if (keys['a'] || keys['arrowleft']) { player.vx = -player.speed; player.facing = -1; }
  else if (keys['d'] || keys['arrowright']) { player.vx = player.speed; player.facing = 1; }
  else player.vx = 0;

  if ((keys['w'] || keys[' '] || keys['arrowup']) && player.grounded) {
    player.vy = player.jumpPower;
    player.grounded = false;
  }

  player.vy += 0.55; // Gravity

  // Player Terrain Collision
  player.x += player.vx;
  resolveXCollisions(player);
  player.y += player.vy;
  player.grounded = resolveYCollisions(player);

  // Attack timer
  if (player.attacking) {
    player.attackTimer--;
    if (player.attackTimer <= 0) player.attacking = false;
  }

  if (player.invulnerable > 0) player.invulnerable--;

  // Enemy AI & Physics
  enemies.forEach((e, idx) => {
    // Basic AI - follow player
    e.vx = e.x < player.x ? 1.5 : -1.5;
    e.vy += 0.5;

    // Slime jumping mechanic
    e.jumpTimer++;
    if (e.jumpTimer > 90) {
      e.vy = -7;
      e.jumpTimer = 0;
    }

    e.x += e.vx;
    resolveXCollisions(e);
    e.y += e.vy;
    resolveYCollisions(e);

    // Player attack hit detection
    if (player.attacking && player.attackTimer === 10) {
      let attackBox = {
        x: player.facing === 1 ? player.x + player.w : player.x - 35,
        y: player.y - 10,
        w: 35, h: player.h + 20
      };

      if (checkOverlap(attackBox, e)) {
        e.hp -= 15;
        e.vy = -4; // Knockback
        e.vx = player.facing * 6;
        if (e.hp <= 0) {
          enemies.splice(idx, 1);
          score += 100;
          kills++;
          document.getElementById('score').innerText = score;
          document.getElementById('kills').innerText = kills;
        }
      }
    }

    // Enemy touches player
    if (checkOverlap(player, e) && player.invulnerable === 0) {
      player.hp -= 15;
      player.invulnerable = 30; // 30 frames grace period
      player.vy = -5;
      player.vx = e.x < player.x ? 6 : -6;
      document.getElementById('hp-fill').style.width = `${Math.max(0, player.hp)}%`;
    }
  });
}

function resolveXCollisions(obj) {
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (world[y][x] !== 0) {
        let block = { x: x * TILE_SIZE, y: y * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE };
        if (checkOverlap(obj, block)) {
          if (obj.vx > 0) obj.x = block.x - obj.w;
          else if (obj.vx < 0) obj.x = block.x + block.w;
        }
      }
    }
  }
}

function resolveYCollisions(obj) {
  let onGround = false;
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (world[y][x] !== 0) {
        let block = { x: x * TILE_SIZE, y: y * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE };
        if (checkOverlap(obj, block)) {
          if (obj.vy > 0) {
            obj.y = block.y - obj.h;
            obj.vy = 0;
            onGround = true;
          } else if (obj.vy < 0) {
            obj.y = block.y + block.h;
            obj.vy = 0;
          }
        }
      }
    }
  }
  return onGround;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw Ground
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (world[y][x] === 1) {
        ctx.fillStyle = '#37474F';
        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        ctx.strokeStyle = '#263238';
        ctx.strokeRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
      }
    }
  }

  // Draw Enemies
  enemies.forEach(e => {
    ctx.fillStyle = e.color;
    ctx.fillRect(e.x, e.y, e.w, e.h);
  });

  // Draw Player
  if (player.hp > 0) {
    ctx.fillStyle = player.invulnerable % 4 > 2 ? '#ff8a80' : '#29b6f6';
    ctx.fillRect(player.x, player.y, player.w, player.h);

    // Sword Arc Attack
    if (player.attacking) {
      ctx.fillStyle = '#fff59d';
      let swordX = player.facing === 1 ? player.x + player.w : player.x - 30;
      ctx.fillRect(swordX, player.y + 10, 30, 8);
    }
  } else {
    // Game Over Text
    ctx.fillStyle = '#e53935';
    ctx.font = '30px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER - Refresh to Restart', canvas.width / 2, canvas.height / 2);
  }
}

function loop() {
  updatePhysics();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
