<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startup Founder: Decision Game</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background-color: #121212;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .game-container {
      width: 360px;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
    }
    /* Meters */
    .meters {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    .meter-box {
      background: #2a2a2a;
      padding: 8px 4px;
      border-radius: 8px;
      font-size: 11px;
    }
    .meter-bar-bg {
      background: #444;
      height: 6px;
      border-radius: 3px;
      margin-top: 6px;
      overflow: hidden;
    }
    .meter-bar-fill {
      height: 100%;
      width: 50%;
      background: #4caf50;
      transition: width 0.3s ease, background-color 0.3s ease;
    }
    /* Card Stack */
    .card-container {
      perspective: 1000px;
      height: 280px;
      margin-bottom: 20px;
    }
    .card {
      background: #2c2c3e;
      border: 2px solid #3f3f5a;
      border-radius: 12px;
      padding: 20px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: transform 0.2s ease;
    }
    .card-title { font-size: 14px; color: #8a8aab; text-transform: uppercase; letter-spacing: 1px; }
    .card-text { font-size: 16px; line-height: 1.4; margin: 15px 0; color: #e0e0e0; }
    .card-icon { font-size: 40px; margin-top: 10px; }
    /* Decision Buttons */
    .choices {
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      padding: 12px 8px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s ease, transform 0.1s;
    }
    .btn:active { transform: scale(0.96); }
    .btn-left { background: #e53935; color: white; }
    .btn-right { background: #1e88e5; color: white; }
    .btn-restart { background: #4caf50; color: white; width: 100%; display: none; margin-top: 10px; }
    
    .game-over-screen { display: none; }
  </style>
</head>
<body>

<div class="game-container">
  <!-- Status Meters -->
  <div class="meters" id="meters">
    <div class="meter-box">
      💰 Money
      <div class="meter-bar-bg"><div class="meter-bar-fill" id="meter-money"></div></div>
    </div>
    <div class="meter-box">
      📈 Users
      <div class="meter-bar-bg"><div class="meter-bar-fill" id="meter-users"></div></div>
    </div>
    <div class="meter-box">
      😃 Morale
      <div class="meter-bar-bg"><div class="meter-bar-fill" id="meter-morale"></div></div>
    </div>
    <div class="meter-box">
      💻 Server
      <div class="meter-bar-bg"><div class="meter-bar-fill" id="meter-server"></div></div>
    </div>
  </div>

  <!-- Active Card Display -->
  <div class="card-container">
    <div class="card" id="card">
      <div>
        <div class="card-title" id="card-sender">Notification</div>
        <div class="card-icon" id="card-icon">💻</div>
        <div class="card-text" id="card-text">Loading deck...</div>
      </div>
      <div class="card-title" style="font-size: 11px;">Days Survived: <span id="day-counter">1</span></div>
    </div>
  </div>

  <!-- Choice Actions -->
  <div class="choices" id="choices">
    <button class="btn btn-left" id="btn-left" onclick="makeChoice('left')">Option A</button>
    <button class="btn btn-right" id="btn-right" onclick="makeChoice('right')">Option B</button>
  </div>
  <button class="btn btn-restart" id="btn-restart" onclick="restartGame()">Restart Game</button>
</div>

<script>
  // Game State (0 to 100 scale)
  let stats = { money: 50, users: 50, morale: 50, server: 50 };
  let day = 1;
  let currentCard = null;

  // Decision Deck: Stories and their branching consequences
  const deck = [
    {
      sender: "Lead Developer",
      icon: "👨‍💻",
      text: "Our server crashed from an influx of new traffic! We need to upgrade immediately.",
      left: { label: "Pay for cloud upgrade", effects: { money: -20, server: +30, users: +10 } },
      right: { label: "Ignore it and wait", effects: { users: -25, server: -20, morale: -10 } }
    },
    {
      sender: "Venture Capitalist",
      icon: "💼",
      text: "An investor offers $50,000, but demands you fire half your engineering team.",
      left: { label: "Accept investment", effects: { money: +40, morale: -35, server: -10 } },
      right: { label: "Reject offer", effects: { money: -10, morale: +15 } }
    },
    {
      sender: "Marketing Manager",
      icon: "📢",
      text: "We can run a viral influencer campaign. It costs money, but could double our userbase.",
      left: { label: "Run the campaign", effects: { money: -25, users: +35, server: -10 } },
      right: { label: "Focus on organic growth", effects: { users: +5, morale: +5 } }
    },
    {
      sender: "Lead Designer",
      icon: "🎨",
      text: "The team wants to completely redesign the dashboard UI. It will delay new features.",
      left: { label: "Approve redesign", effects: { morale: +20, users: +10, money: -10 } },
      right: { label: "Deny request", effects: { morale: -20, users: -5 } }
    },
    {
      sender: "Security Researcher",
      icon: "🔒",
      text: "I found a major security flaw in your database. Fix it now or risk a leak.",
      left: { label: "Hire auditors to fix", effects: { money: -20, server: +25 } },
      right: { label: "Patch it yourself later", effects: { server: -35, users: -10 } }
    }
  ];

  function updateMeters() {
    for (let key in stats) {
      // Clamp between 0 and 100
      stats[key] = Math.max(0, Math.min(100, stats[key]));
      
      const bar = document.getElementById(`meter-${key}`);
      bar.style.width = stats[key] + '%';
      
      // Dynamic color shift based on health
      if (stats[key] < 25) bar.style.backgroundColor = '#e53935';
      else if (stats[key] < 50) bar.style.backgroundColor = '#fdd835';
      else bar.style.backgroundColor = '#4caf50';
    }
  }

  function loadCard() {
    // Pick a random card from deck
    const randomIndex = Math.floor(Math.random() * deck.length);
    currentCard = deck[randomIndex];

    document.getElementById('card-sender').innerText = currentCard.sender;
    document.getElementById('card-icon').innerText = currentCard.icon;
    document.getElementById('card-text').innerText = currentCard.text;
    document.getElementById('btn-left').innerText = currentCard.left.label;
    document.getElementById('btn-right').innerText = currentCard.right.label;
    document.getElementById('day-counter').innerText = day;
  }

  function makeChoice(direction) {
    const choice = currentCard[direction];
    
    // Apply statistical consequences
    for (let stat in choice.effects) {
      if (stats.hasOwnProperty(stat)) {
        stats[stat] += choice.effects[stat];
      }
    }

    day++;
    updateMeters();

    // Check game over state
    if (checkGameOver()) return;

    loadCard();
  }

  function checkGameOver() {
    let reason = "";
    if (stats.money <= 0) reason = "You ran out of money! The company went bankrupt.";
    else if (stats.users <= 0) reason = "All your users left for a competitor.";
    else if (stats.morale <= 0) reason = "Your entire team quit due to burnout.";
    else if (stats.server <= 0) reason = "Your servers suffered a catastrophic crash.";

    if (reason) {
      document.getElementById('card-sender').innerText = "GAME OVER";
      document.getElementById('card-icon').innerText = "☠️";
      document.getElementById('card-text').innerText = `${reason}\n\nYou survived for ${day} days!`;
      
      document.getElementById('choices').style.display = 'none';
      document.getElementById('btn-restart').style.display = 'block';
      return true;
    }
    return false;
  }

  function restartGame() {
    stats = { money: 50, users: 50, morale: 50, server: 50 };
    day = 1;
    document.getElementById('choices').style.display = 'flex';
    document.getElementById('btn-restart').style.display = 'none';
    updateMeters();
    loadCard();
  }

  // Initialize
  updateMeters();
  loadCard();
</script>

</body>
</html>
