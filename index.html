<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clash Royale 2D - Full Arena</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0d0e15;
      color: #fff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 420px;
      height: 720px;
      background: #1e1e28;
      border: 4px solid #3d3d5c;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.8);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Scoreboard Header */
    #scoreboard {
      height: 40px;
      background: #14141e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      font-weight: bold;
      font-size: 14px;
      border-bottom: 2px solid #2a2a3c;
      z-index: 5;
    }

    .crown-count { display: flex; align-items: center; gap: 6px; }
    .crown-count.blue { color: #42a5f5; }
    .crown-count.red { color: #ef5350; }

    /* Canvas Arena */
    canvas {
      display: block;
      background: #3e8e41;
      cursor: crosshair;
    }

    /* Deck & Elixir UI */
    #ui {
      height: 120px;
      background: #14141e;
      border-top: 2px solid #2a2a3c;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .elixir-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .elixir-val {
      font-size: 14px;
      font-weight: 800;
      color: #ff4081;
      width: 50px;
    }

    .elixir-bar-bg {
      flex: 1;
      height: 12px;
      background: #2a2a3c;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #3f3f5a;
    }

    .elixir-bar-fill {
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, #ec407a, #ff4081);
      box-shadow: 0 0 8px #ff4081;
      transition: width 0.1s linear;
    }

    .card-deck {
      display: flex;
      gap: 8px;
    }

    .card {
      flex: 1;
      height: 72px;
      background: #252538;
      border: 2px solid #454568;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 6px 4px;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.2s, background 0.2s;
    }

    .card.selected {
      border-color: #ffd54f;
      background: #32324e;
      transform: translateY(-4px);
      box-shadow: 0 4px 12px rgba(255, 213, 79, 0.3);
    }

    .card.disabled {
      opacity: 0.4;
      filter: grayscale(80%);
      cursor: not-allowed;
    }

    .card-icon { font-size: 22px; line-height: 1; }
    .card-info { text-align: center; }
    .card-name { font-size: 10px; font-weight: bold; color: #ddd; }
    .card-cost { font-size: 11px; font-weight: 800; color: #ff4081; }

    /* Overlay Screens */
    #game-over {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 10, 16, 0.9);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    #game-over h1 { font-size: 36px; color: #ffd54f; margin-bottom: 8px; text-shadow: 0 0 10px rgba(255,213,79,0.5); }
    #game-over p { font-size: 14px; color: #ccc; margin-bottom: 20px; }
    
    .btn-restart {
      padding: 12px 28px;
      font-size: 15px;
      font-weight: bold;
      background: #66bb6a;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(102, 187, 106, 0.4);
      transition: transform 0.1s, background 0.2s;
    }
    .btn-restart:hover { background: #81c784; }
    .btn-restart:active { transform: scale(0.96); }
  </style>
</head>
<body>

<div id="game-container">
  <div id="scoreboard">
    <div class="crown-count blue">👑 <span id="blue-crowns">0</span></div>
    <div style="color: #888; font-size: 12px;">CLASH ARENA</div>
    <div class="crown-count red"><span id="red-crowns">0</span> 👑</div>
  </div>

  <canvas id="arena" width="420" height="560"></canvas>

  <div id="ui">
    <div class="elixir-container">
      <div class="elixir-val">💧 <span id="elixir-num">5</span>/10</div>
      <div class="elixir-bar-bg">
        <div class="elixir-bar-fill" id="elixir-fill"></div>
      </div>
    </div>

    <div class="card-deck">
      <div class="card selected" id="card-0" onclick="selectCard(0)">
        <div class="card-icon">⚔️</div>
        <div class="card-info">
          <div class="card-name">Knight</div>
          <div class="card-cost">💧 3</div>
        </div>
      </div>
      <div class="card" id="card-1" onclick="selectCard(1)">
        <div class="card-icon">🏹</div>
        <div class="card-info">
          <div class="card-name">Archers</div>
          <div class="card-cost">💧 3</div>
        </div>
      </div>
      <div class="card" id="card-2" onclick="selectCard(2)">
        <div class="card-icon">🛡️</div>
        <div class="card-info">
          <div class="card-name">Giant</div>
          <div class="card-cost">💧 5</div>
        </div>
      </div>
      <div class="card" id="card-3" onclick="selectCard(3)">
        <div class="card-icon">🔥</div>
        <div class="card-info">
          <div class="card-name">Fireball</div>
          <div class="card-cost">💧 4</div>
        </div>
      </div>
    </div>
  </div>

  <div id="game-over">
    <h1 id="winner-text">VICTORY!</h1>
    <p id="winner-sub">You destroyed the enemy King Tower!</p>
    <button class="btn-restart" onclick="restartGame()">Play Again</button>
  </div>
</div>

<script>
const canvas = document.getElementById('arena');
const ctx = canvas.getContext('2d');

// Game Engine State
let elixir = 5;
const maxElixir = 10;
let selectedCardIndex = 0;
let gameOver = false;
let redCrowns = 0;
let blueCrowns = 0;

// Card Deck Database
const CARDS = [
  { id: 'knight', name: 'Knight', cost: 3, hp: 240, damage: 24, speed: 1.1, range: 24, rate: 55, icon: '⚔️', count: 1, targets: 'all', type: 'troop' },
  { id: 'archers', name: 'Archers', cost: 3, hp: 110, damage: 16, speed: 1.3, range: 120, rate: 40, icon: '🏹', count: 2, targets: 'all', type: 'troop' },
  { id: 'giant', name: 'Giant', cost: 5, hp: 650, damage: 32, speed: 0.65, range: 28, rate: 75, icon: '🛡️', count: 1, targets: 'buildings', type: 'troop' },
  { id: 'fireball', name: 'Fireball', cost: 4, damage: 160, radius: 55, icon: '🔥', type: 'spell' }
];

let units = [];
let projectiles = [];
let towers = [];
let particles = [];

function initTowers() {
  towers = [
    // Player Towers (Blue / Bottom)
    { id: 'p_king', team: 'player', x: 210, y: 500, hp: 900, maxHp: 900, range: 130, rate: 45, cooldown: 0, r: 24, isKing: true, targets: 'all' },
    { id: 'p_left', team: 'player', x: 95, y: 435, hp: 550, maxHp: 550, range: 120, rate: 38, cooldown: 0, r: 18, isKing: false, targets: 'all' },
    { id: 'p_right', team: 'player', x: 325, y: 435, hp: 550, maxHp: 550, range: 120, rate: 38, cooldown: 0, r: 18, isKing: false, targets: 'all' },

    // Enemy Towers (Red / Top)
    { id: 'e_king', team: 'enemy', x: 210, y: 60, hp: 900, maxHp: 900, range: 130, rate: 45, cooldown: 0, r: 24, isKing: true, targets: 'all' },
    { id: 'e_left', team: 'enemy', x: 95, y: 125, hp: 550, maxHp: 550, range: 120, rate: 38, cooldown: 0, r: 18, isKing: false, targets: 'all' },
    { id: 'e_right', team: 'enemy', x: 325, y: 125, hp: 550, maxHp: 550, range: 120, rate: 38, cooldown: 0, r: 18, isKing: false, targets: 'all' }
  ];
}

function selectCard(index) {
  selectedCardIndex = index;
  document.querySelectorAll('.card').forEach((el, i) => {
    el.classList.toggle('selected', i === index);
  });
}

// Deploy Logic
canvas.addEventListener('click', (e) => {
  if (gameOver) return;

  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const card = CARDS[selectedCardIndex];

  // Spell can be cast anywhere, troops restricted to user's half
  if (card.type !== 'spell' && y < 270) return;

  if (elixir >= card.cost) {
    elixir -= card.cost;
    
    if (card.type === 'spell') {
      castSpell('player', card, x, y);
    } else {
      deployTroopGroup('player', card, x, y);
    }
    updateUI();
  }
});

function deployTroopGroup(team, card, x, y) {
  for (let i = 0; i < card.count; i++) {
    const offsetX = (i - (card.count - 1) / 2) * 20;
    spawnUnit(team, card, x + offsetX, y);
  }
}

function spawnUnit(team, card, x, y) {
  units.push({
    ...card,
    team: team,
    x: x,
    y: y,
    maxHp: card.hp,
    cooldown: 0,
    r: card.id === 'giant' ? 14 : 10
  });
}

function castSpell(team, card, targetX, targetY) {
  // Fireball Effect Animation + AOE Damage
  particles.push({
    x: targetX, y: targetY, radius: card.radius, alpha: 1, duration: 20
  });

  // Damage all enemy entities in radius
  const targets = [
    ...units.filter(u => u.team !== team),
    ...towers.filter(t => t.team !== team)
  ];

  targets.forEach(t => {
    if (Math.hypot(t.x - targetX, t.y - targetY) <= card.radius + t.r) {
      t.hp -= card.damage;
    }
  });
}

// Enemy AI Spawner Loop
setInterval(() => {
  if (gameOver) return;
  const randomCard = CARDS[Math.floor(Math.random() * (CARDS.length - 1))]; // Spawns troops
  const spawnX = Math.random() > 0.5 ? 95 : 325;
  deployTroopGroup('enemy', randomCard, spawnX, 100);
}, 5500);

// Elixir Timer
setInterval(() => {
  if (gameOver || elixir >= maxElixir) return;
  elixir = Math.min(maxElixir, elixir + 0.5);
  updateUI();
}, 700);

function updateUI() {
  document.getElementById('elixir-num').innerText = Math.floor(elixir);
  document.getElementById('elixir-fill').style.width = `${(elixir / maxElixir) * 100}%`;

  CARDS.forEach((card, i) => {
    const cardEl = document.getElementById(`card-${i}`);
    if (cardEl) {
      cardEl.classList.toggle('disabled', elixir < card.cost);
    }
  });

  document.getElementById('blue-crowns').innerText = blueCrowns;
  document.getElementById('red-crowns').innerText = redCrowns;
}

function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

// Main Game Engine Loop
function update() {
  if (gameOver) return;

  // 1. Process Units
  units.forEach(u => {
    let potentialTargets = [];
    
    if (u.targets === 'buildings') {
      potentialTargets = towers.filter(t => t.team !== u.team);
    } else {
      potentialTargets = [
        ...units.filter(o => o.team !== u.team),
        ...towers.filter(t => t.team !== u.team)
      ];
    }

    let target = null;
    let minDist = Infinity;

    potentialTargets.forEach(t => {
      let d = dist(u, t);
      if (d < minDist) {
        minDist = d;
        target = t;
      }
    });

    if (target) {
      if (minDist <= u.range) {
        // Combat Execution
        if (u.cooldown <= 0) {
          if (u.range > 40) {
            projectiles.push({ x: u.x, y: u.y, target: target, damage: u.damage, speed: 5.5 });
          } else {
            target.hp -= u.damage;
          }
          u.cooldown = u.rate;
        }
      } else {
        // Movement & Bridge Waypoint Routing
        let moveTargetX = target.x;
        let moveTargetY = target.y;

        // Route through nearest bridge if crossing the river
        if ((u.team === 'player' && u.y > 290 && target.y < 270) ||
            (u.team === 'enemy' && u.y < 270 && target.y > 290)) {
          moveTargetX = u.x < 210 ? 95 : 325;
          moveTargetY = 280;
        }

        let angle = Math.atan2(moveTargetY - u.y, moveTargetX - u.x);
        u.x += Math.cos(angle) * u.speed;
        u.y += Math.sin(angle) * u.speed;
      }
    }

    if (u.cooldown > 0) u.cooldown--;
  });

  // 2. Process Towers
  towers.forEach(t => {
    let enemiesInArea = units.filter(u => u.team !== t.team && dist(t, u) <= t.range);
    if (enemiesInArea.length > 0) {
      if (t.cooldown <= 0) {
        enemiesInArea.sort((a, b) => dist(t, a) - dist(t, b));
        projectiles.push({ x: t.x, y: t.y, target: enemiesInArea[0], damage: 22, speed: 6.5 });
        t.cooldown = t.rate;
      }
    }
    if (t.cooldown > 0) t.cooldown--;
  });

  // 3. Process Projectiles
  projectiles.forEach((p, idx) => {
    let angle = Math.atan2(p.target.y - p.y, p.target.x - p.x);
    p.x += Math.cos(angle) * p.speed;
    p.y += Math.sin(angle) * p.speed;

    if (dist(p, p.target) < 8) {
      p.target.hp -= p.damage;
      projectiles.splice(idx, 1);
    }
  });

  // 4. Process Particles / Spells
  particles.forEach((p, idx) => {
    p.duration--;
    if (p.duration <= 0) particles.splice(idx, 1);
  });

  // 5. Cleanup & Crown Calculation
  units = units.filter(u => u.hp > 0);
  
  towers.forEach(t => {
    if (t.hp <= 0) {
      if (t.team === 'enemy') blueCrowns++;
      else redCrowns++;

      if (t.isKing) {
        endGame(t.team === 'enemy' ? 'VICTORY!' : 'DEFEAT!');
      }
    }
  });
  towers = towers.filter(t => t.hp > 0);
  updateUI();
}

function endGame(message) {
  gameOver = true;
  document.getElementById('winner-text').innerText = message;
  document.getElementById('winner-sub').innerText = message === 'VICTORY!' ? 'You destroyed the Enemy King Tower!' : 'Your King Tower was destroyed!';
  document.getElementById('game-over').style.display = 'flex';
}

function restartGame() {
  units = [];
  projectiles = [];
  particles = [];
  elixir = 5;
  blueCrowns = 0;
  redCrowns = 0;
  gameOver = false;
  document.getElementById('game-over').style.display = 'none';
  initTowers();
  updateUI();
}

// Render Pipeline
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // River & Arena Boundaries
  ctx.fillStyle = '#29b6f6';
  ctx.fillRect(0, 260, canvas.width, 40);
  
  // Bridges
  ctx.fillStyle = '#8d6e63';
  ctx.fillRect(75, 255, 40, 50);  // Left
  ctx.fillRect(305, 255, 40, 50); // Right

  // Bridge Planks
  ctx.strokeStyle = '#5d4037';
  ctx.lineWidth = 2;
  for (let i = 260; i <= 300; i += 10) {
    ctx.beginPath(); ctx.moveTo(75, i); ctx.lineTo(115, i); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(305, i); ctx.lineTo(345, i); ctx.stroke();
  }

  // Draw Towers
  towers.forEach(t => {
    ctx.fillStyle = t.team === 'player' ? '#1e88e5' : '#e53935';
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Tower Crown Accent
    ctx.fillStyle = '#ffd54f';
    ctx.font = t.isKing ? '16px sans-serif' : '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('👑', t.x, t.y + (t.isKing ? 5 : 4));

    // Health Bar
    drawHealthBar(t.x - 22, t.y - t.r - 12, 44, 6, t.hp, t.maxHp);
  });

  // Draw Units
  units.forEach(u => {
    ctx.fillStyle = u.team === 'player' ? '#2196f3' : '#f44336';
    ctx.beginPath();
    ctx.arc(u.x, u.y, u.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Icon
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(u.icon, u.x, u.y + 4);

    // Health Bar
    drawHealthBar(u.x - 16, u.y - u.r - 8, 32, 4, u.hp, u.maxHp);
  });

  // Draw Projectiles
  ctx.fillStyle = '#ffd54f';
  projectiles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fill();
  });

  // Draw Spell Particles
  particles.forEach(p => {
    ctx.fillStyle = 'rgba(255, 87, 34, 0.4)';
    ctx.strokeStyle = '#ff5722';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  });
}

function drawHealthBar(x, y, w, h, hp, maxHp) {
  const pct = Math.max(0, hp / maxHp);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = pct > 0.4 ? '#66bb6a' : '#ef5350';
  ctx.fillRect(x, y, w * pct, h);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Start Game
initTowers();
updateUI();
loop();
</script>
</body>
</html>
